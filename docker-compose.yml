services:
  mysql:
    image: mysql:8.4
    container_name: student-placement-mysql
    restart: always
    environment:
      MYSQL_DATABASE: placementdb
      MYSQL_USER: placement
      MYSQL_PASSWORD: placement123
      MYSQL_ROOT_PASSWORD: rootlocal123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootlocal123"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: student-placement-app
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/placementdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: placement
      SPRING_DATASOURCE_PASSWORD: placement123
      SERVER_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
