apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-placement
  namespace: placement
spec:
  replicas: 2
  selector:
    matchLabels: {app: student-placement}
  template:
    metadata:
      labels: {app: student-placement}
    spec:
      containers:
      - name: student-placement
        image: IMAGE_PLACEHOLDER
        ports: [{containerPort: 8080}]
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:mysql://mysql:3306/placementdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom: {secretKeyRef: {name: placement-db-secret, key: username}}
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom: {secretKeyRef: {name: placement-db-secret, key: password}}
        readinessProbe:
          tcpSocket: {port: 8080}
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          tcpSocket: {port: 8080}
          initialDelaySeconds: 45
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: student-placement
  namespace: placement
spec:
  type: NodePort
  selector: {app: student-placement}
  ports:
  - {port: 8080, targetPort: 8080, nodePort: 30080}