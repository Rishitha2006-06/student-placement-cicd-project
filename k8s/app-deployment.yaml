apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-placement
  namespace: placement
  labels:
    app: student-placement
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-placement
  template:
    metadata:
      labels:
        app: student-placement
    spec:
      containers:
      - name: student-placement
        image: IMAGE_PLACEHOLDER
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:mysql://mysql:3306/placementdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: placement-db-secret
              key: username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: placement-db-secret
              key: password
        - name: SERVER_PORT
          value: "8000"
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 25
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 40
          periodSeconds: 20
