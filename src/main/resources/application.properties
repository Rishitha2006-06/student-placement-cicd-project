spring.application.name=student-placement
server.port=${SERVER_PORT:8000}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/placementdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:placement}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:placement123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
