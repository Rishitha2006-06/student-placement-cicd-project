<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Job</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/style.css}"></head><body><nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand" href="/">CampusConnect</a><a class="btn btn-outline-light btn-sm" href="/">Home</a></div></nav><main class="container py-5"><div class="form-panel mx-auto"><p class="eyebrow">ADMIN TOOL</p><h1 class="h2 mb-4">Add a job opening</h1><form th:action="@{/jobs}" th:object="${job}" method="post"><label class="form-label">Job title</label><input class="form-control mb-3" th:field="*{title}" required><label class="form-label">Company</label><input class="form-control mb-3" th:field="*{company}" required><label class="form-label">Location</label><input class="form-control mb-3" th:field="*{location}"><label class="form-label">Eligibility</label><input class="form-control mb-4" th:field="*{eligibility}"><button class="btn btn-primary w-100">Save job</button></form></div></main></body></html>
