<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Job Opening - CampusConnect Placement Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

    <!-- Left Sidebar -->
    <aside class="app-sidebar">
        <div class="sidebar-header">
            <div class="logo-icon"><i class="bi bi-mortarboard-fill text-white"></i></div>
            <div>
                <h2>Student Placement<br><span style="font-size:0.78rem; font-weight:500; color:#94a3b8;">Management System</span></h2>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="/admin" class="sidebar-link"><i class="bi bi-house-door"></i> <span>Dashboard</span></a>
            <a href="/admin#studentModal" class="sidebar-link"><i class="bi bi-people"></i> <span>Manage Students</span></a>
            <a href="/admin#companyModal" class="sidebar-link"><i class="bi bi-buildings"></i> <span>Manage Companies</span></a>
            <a href="/jobs/new" class="sidebar-link active"><i class="bi bi-briefcase-fill"></i> <span>Manage Jobs</span></a>
            <a href="/applications" class="sidebar-link"><i class="bi bi-file-earmark-text"></i> <span>View Applications</span></a>
        </nav>

        <div class="sidebar-footer">
            <a href="/" class="sidebar-link text-danger-emphasis"><i class="bi bi-box-arrow-left"></i> <span>Logout</span></a>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="app-main">
        <header class="app-topbar">
            <div class="topbar-left">
                <span class="brand-badge">CampusConnect</span>
                <div class="role-switcher">
                    <a href="/" class="role-btn"><i class="bi bi-person-fill"></i> Student</a>
                    <a href="/admin" class="role-btn active"><i class="bi bi-shield-lock-fill"></i> Admin</a>
                    <a href="/company" class="role-btn"><i class="bi bi-building"></i> Company</a>
                </div>
            </div>
            <div class="topbar-right">
                <div class="user-profile-pill">
                    <div class="user-avatar admin-avatar">A</div>
                    <span>Admin</span>
                </div>
            </div>
        </header>

        <main class="dashboard-content">
            <div class="panel-card mx-auto" style="max-width: 680px;">
                <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom">
                    <div>
                        <span class="brand-badge mb-2 d-inline-block">ADMIN & COMPANY TOOL</span>
                        <h1 class="h3 fw-bold mb-0">Add a job opening</h1>
                    </div>
                    <a href="/" class="btn btn-outline-secondary btn-sm" style="border-radius:8px;">Back to Dashboard</a>
                </div>

                <form th:action="@{/jobs}" th:object="${job}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Job Title</label>
                        <input class="form-control" th:field="*{title}" placeholder="e.g. Cloud Solutions Architect" required style="border-radius:10px;">
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Company Name</label>
                            <input class="form-control" th:field="*{company}" placeholder="e.g. Google / Microsoft" required style="border-radius:10px;">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Job Type</label>
                            <select class="form-select" th:field="*{jobType}" style="border-radius:10px;">
                                <option value="Full Time">Full Time</option>
                                <option value="Internship">Internship</option>
                            </select>
                        </div>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Location</label>
                            <input class="form-control" th:field="*{location}" placeholder="e.g. Bengaluru / Hyderabad / Remote" style="border-radius:10px;">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">CTC Package</label>
                            <input class="form-control" th:field="*{packageLpa}" placeholder="e.g. 18 LPA" style="border-radius:10px;">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Eligibility Criteria</label>
                        <textarea class="form-control" th:field="*{eligibility}" rows="3" placeholder="e.g. B.Tech CSE/IT with 7.5+ CGPA and no backlogs" style="border-radius:10px;"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" style="background:#2563eb; border-radius:12px;">Save & Post Job</button>
                </form>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
