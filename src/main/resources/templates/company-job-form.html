<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Job Opening - Company Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

    <!-- Left Sidebar -->
    <aside class="app-sidebar">
        <div class="sidebar-header">
            <div class="logo-icon"><i class="bi bi-mortarboard-fill text-white"></i></div>
            <div>
                <h2>Student Placement<br><span style="font-size:0.78rem; font-weight:500; color:#94a3b8;">Management System</span></h2>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="/company" class="sidebar-link"><i class="bi bi-house-door"></i> <span>Dashboard</span></a>
            <a href="/company/jobs/new" class="sidebar-link active"><i class="bi bi-plus-circle-fill"></i> <span>Post Job</span></a>
            <a href="/company/applicants" class="sidebar-link"><i class="bi bi-people"></i> <span>View Applicants</span></a>
            <a href="/company/shortlisted" class="sidebar-link"><i class="bi bi-person-check"></i> <span>Shortlisted Candidates</span></a>
            <a href="/company/jobs" class="sidebar-link"><i class="bi bi-briefcase"></i> <span>My Jobs</span></a>
            <a href="/company/profile" class="sidebar-link"><i class="bi bi-building"></i> <span>Company Profile</span></a>
        </nav>

        <div class="sidebar-footer">
            <a href="/" class="sidebar-link text-danger-emphasis"><i class="bi bi-box-arrow-left"></i> <span>Logout</span></a>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="app-main">
        <!-- Top Navigation Bar -->
        <header class="app-topbar">
            <div class="topbar-left">
                <span class="brand-badge">CampusConnect</span>
                <div class="role-switcher">
                    <a href="/" class="role-btn"><i class="bi bi-person-fill"></i> Student</a>
                    <a href="/admin" class="role-btn"><i class="bi bi-shield-lock-fill"></i> Admin</a>
                    <a href="/company" class="role-btn active"><i class="bi bi-building"></i> Company</a>
                </div>
            </div>

            <div class="topbar-right">
                <div class="user-profile-pill">
                    <div class="user-avatar company-avatar">C</div>
                    <span>TechCorp</span>
                </div>
            </div>
        </header>

        <!-- Main Body -->
        <main class="dashboard-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h2 fw-bold mb-1">Post a New Job Opening</h1>
                    <p class="text-secondary mb-0">Create a placement drive and publish it to eligible campus students</p>
                </div>
                <a href="/company/jobs" class="btn btn-outline-secondary" style="border-radius:10px;"><i class="bi bi-arrow-left me-1"></i> Back to Jobs</a>
            </div>

            <div class="panel-card" style="max-width: 800px;">
                <form th:action="@{/company/jobs}" th:object="${job}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Job Role / Title</label>
                            <input class="form-control" th:field="*{title}" placeholder="e.g. Cloud DevOps Engineer" required style="border-radius:10px;">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Company Name</label>
                            <input class="form-control" th:field="*{company}" value="TechCorp" required style="border-radius:10px;">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Work Location</label>
                            <input class="form-control" th:field="*{location}" placeholder="e.g. Bengaluru / Hybrid" required style="border-radius:10px;">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Employment Type</label>
                            <select class="form-select" th:field="*{jobType}" style="border-radius:10px;">
                                <option value="Full Time">Full Time</option>
                                <option value="Internship">Internship</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Package (LPA)</label>
                            <input class="form-control" th:field="*{packageLpa}" placeholder="e.g. 14 LPA" style="border-radius:10px;">
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-bold">Eligibility & Requirements</label>
                            <textarea class="form-control" th:field="*{eligibility}" rows="3" placeholder="e.g. B.Tech CSE/IT, CGPA >= 7.5, Good knowledge of Java, Spring Boot, and Cloud CI/CD" required style="border-radius:10px;"></textarea>
                        </div>
                        <div class="col-12 text-end pt-3">
                            <button type="submit" class="btn btn-primary px-4 py-2" style="background:#2563eb; border-radius:10px;">
                                <i class="bi bi-send-fill me-1"></i> Publish Job Opening
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
