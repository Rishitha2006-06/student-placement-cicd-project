<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Applications</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/style.css}"></head><body><nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand" href="/">CampusConnect</a><a class="btn btn-outline-light btn-sm" href="/">Home</a></div></nav><main class="container py-5"><div th:if="${message}" class="alert alert-success" th:text="${message}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><p class="eyebrow">ADMIN VIEW</p><h1 class="h2 mb-4">Student applications</h1><div class="table-responsive bg-white rounded-4 p-3"><table class="table align-middle"><thead><tr><th>Student</th><th>Email</th><th>Role</th><th>Company</th><th>Status</th><th>Update</th></tr></thead><tbody><tr th:each="a : ${applications}"><td th:text="${a.studentName}"></td><td th:text="${a.email}"></td><td th:text="${a.job.title}"></td><td th:text="${a.job.company}"></td><td th:text="${a.status}"></td><td><form th:action="@{/applications/{id}/status(id=${a.id})}" method="post" class="d-flex gap-2"><select class="form-select form-select-sm" name="status"><option>Applied</option><option>Shortlisted</option><option>Selected</option><option>Rejected</option></select><button class="btn btn-primary btn-sm">Save</button></form></td></tr><tr th:if="${applications.isEmpty()}"><td colspan="6">No applications yet.</td></tr></tbody></table></div></main></body></html>
